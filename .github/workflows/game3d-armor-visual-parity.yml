name: Game 3D Live Armor Viewer Parity
on:
  pull_request:
    paths:
      - 'src/components/game3d/GameWorld3D.jsx'
      - 'src/components/game3d/armor/**'
      - 'src/components/game3d/equipment/**'
      - 'src/components/onboarding/avatarAssetRuntime.js'
      - 'src/components/onboarding/creatorBuiltinLayers.js'
      - 'src/components/onboarding/customizationRuntime.js'
      - 'tests/game3d-armor-live-viewer-sync.test.mjs'
      - '.github/workflows/game3d-armor-visual-parity.yml'
  push:
    paths:
      - 'src/components/game3d/armor/**'
      - 'src/components/onboarding/customizationRuntime.js'
      - 'tests/game3d-armor-live-viewer-sync.test.mjs'
permissions:
  contents: read
jobs:
  armor-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Verify live actor, services, roster, inventory armor and fitted GLBs
        run: node --test tests/game3d-armor-live-viewer-sync.test.mjs tests/game3d-mobile-armor-viewer-parity.test.mjs
      - name: Build both 3D viewers with the actual Vite pipeline
        run: npm run build
