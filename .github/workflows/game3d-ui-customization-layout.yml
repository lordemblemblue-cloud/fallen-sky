name: Game 3D UI Customization and Layout

on:
  pull_request:
    paths:
      - 'src/components/game3d/game3dPauseMenuModel.mjs'
      - 'src/components/game3d/PauseMenu.jsx'
      - 'src/components/game3d/PauseMenu.css'
      - 'src/components/game3d/hud/Game3DHudCustomization.mjs'
      - 'src/components/game3d/hud/Game3DHudLayoutEditor.jsx'
      - 'src/components/game3d/hud/Game3DHudLayoutEditor.css'
      - 'src/components/game3d/hud/Game3DHudLayoutVariants.css'
      - 'src/components/game3d/hud/JadeSoulHUD.jsx'
      - 'src/components/game3d/GameWorld3D.jsx'
      - 'src/pages/GameView.jsx'
      - 'tests/game3d-ui-customization-movable-hud-20261117.test.mjs'
      - 'tests/game3d-console-settings-shared.test.mjs'
      - 'tests/game3d-first-reference-splash-five-skill-weapon-layout-20261117.test.mjs'
      - '.github/workflows/game3d-ui-customization-layout.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hud-options:
    name: Native settings, gameplay isolation and full Vite build
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install reproducible dependencies
        run: npm ci
      - name: Verify HUD preferences, live layout and original asset
        run: >
          node --test
          tests/game3d-ui-customization-movable-hud-20261117.test.mjs
          tests/game3d-console-settings-shared.test.mjs
          tests/game3d-first-reference-splash-five-skill-weapon-layout-20261117.test.mjs
          tests/game3d-compact-right-splash-no-weapon-popups-20261117.test.mjs
          tests/game3d-clone-display-resolution.test.mjs
      - name: Compile Game 3D
        run: npm run build
