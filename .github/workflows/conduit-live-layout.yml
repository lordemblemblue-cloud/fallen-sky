name: Conduit live layout generation
on:
  push:
    branches: ['conduit/normal-match-activation']
  pull_request:
    paths:
      - 'src/components/duelist/sim/conduitLive*'
      - 'src/components/duelist/sim/modeArenaLayout.mjs'
      - 'src/components/duelist/client/maps/conduitArena.mjs'
      - '.github/workflows/conduit-live-layout.yml'
permissions:
  contents: read
jobs:
  manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node scripts/export-duelist-conduit-manifest.mjs /tmp/conduit.json
      - name: Export trusted geometry as text chunks
        run: |
          node --input-type=module -e "import {readFileSync} from 'node:fs';const s=readFileSync('/tmp/conduit.json','utf8');for(let i=0;i<s.length;i+=1800)console.log('CONDUIT_LAYOUT_CHUNK '+i+' '+s.slice(i,i+1800));"
