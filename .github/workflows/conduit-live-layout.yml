name: Conduit live layout generation
on:
  push:
    branches: ['conduit/normal-match-activation']
  pull_request:
    paths:
      - 'src/components/duelist/sim/conduitLive*'
      - 'src/components/duelist/sim/modeArenaLayout.mjs'
      - 'src/components/duelist/client/maps/conduitArena.mjs'
      - '.github/workflows/conduit-live-layout.yml'
permissions:
  contents: read
jobs:
  manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node scripts/export-duelist-conduit-manifest.mjs /tmp/conduit.json
      - name: Validate checked-in collision manifest against actual assembled map
        run: node --input-type=module -e "import assert from 'node:assert/strict';import {readFileSync} from 'node:fs';import m from './src/components/duelist/sim/conduitLiveData.mjs';assert.deepEqual(m,JSON.parse(readFileSync('/tmp/conduit.json','utf8')));"
      - run: node --test tests/duelist-mode-arena-layout.test.mjs tests/duelist-conduit*.test.mjs tests/duelist-match.test.mjs tests/duelist-server.test.mjs tests/duelist-online-server-browser.test.mjs
      - run: npm run build
