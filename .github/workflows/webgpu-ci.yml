name: WebGPU Migration Checks
on:
  push:
    branches:
      - 'feature/webgpu-*'
    paths:
      - 'src/lib/**'
      - 'src/components/duelist/**'
      - 'src/components/game3d/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/webgpu-ci.yml'
  pull_request:
    paths:
      - 'src/lib/**'
      - 'src/components/duelist/**'
      - 'src/components/game3d/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/webgpu-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: webgpu-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Renderer selection unit tests
        run: node --test tests/rendererSelection.test.mjs
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
