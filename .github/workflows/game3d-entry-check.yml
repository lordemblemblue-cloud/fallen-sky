name: Game 3D avatar and world-entry verification
on:
  push:
    branches: [main, 'fix/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  game3d:
    name: Models, contracts and Vite build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # The model tests import 'three'; setup-node's npm cache does not install it.
      - name: Install lockfile dependencies
        run: npm ci
      - name: Verify clone-town paving, house clearance and rear mountain grade
        run: node --test tests/game3d-clone-town-tile-houses-rear-mountain.test.mjs tests/game3d-town-bridge-park-seams.test.mjs
      - name: Verify exact Adam and Eve GLB assets
        run: npm run verify:game3d-characters
      - name: Verify character routes and entry contracts
        run: node --test scripts/game3d-entry-contract.test.mjs
      - name: Verify exact facial rig matching and detailed creator UI
        run: node --test scripts/game3d-expression-qa.test.mjs
      - name: Verify Crescent Moon clone inventory and Blacksmith upgrade guards
        run: node --test tests/game3d-clone-enhancement-ownership.test.mjs tests/game3d-clone-crescent-moon-equipment.test.mjs
      - name: Build complete Game 3D application
        run: npm run build
