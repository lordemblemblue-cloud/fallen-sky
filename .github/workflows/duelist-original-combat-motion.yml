name: Duelist Original Combat Motion

on:
  pull_request:
    paths:
      - 'src/components/duelist/core/moveMotion.mjs'
      - 'src/components/duelist/core/cuts.mjs'
      - 'src/components/duelist/core/classes.mjs'
      - 'src/components/duelist/client/animator.mjs'
      - 'src/components/duelist/client/classMotionBlend.mjs'
      - 'tests/duelist-class-motion-identity.test.mjs'
      - 'tests/duelist-class-motion-blend.test.mjs'
      - '.github/workflows/duelist-original-combat-motion.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  combat-motion:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify four forms, original clips and contact frames
        run: node --test tests/duelist-class-motion-identity.test.mjs tests/duelist-class-motion-blend.test.mjs tests/duelist-motion.test.mjs tests/duelist-cuts.test.mjs tests/duelist-flow.test.mjs
      - name: Lint motion mapping and regression tests
        run: npx eslint src/components/duelist/core/moveMotion.mjs src/components/duelist/client/animator.mjs src/components/duelist/client/classMotionBlend.mjs tests/duelist-class-motion-identity.test.mjs tests/duelist-class-motion-blend.test.mjs
      - name: Verify application compiles
        run: npm run build
