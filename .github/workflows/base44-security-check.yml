name: Base44 security access rules and high-risk dependency audit

on:
  push:
    branches: [main]
    paths:
      - 'base44/entities/**'
      - 'base44/functions/clanMembershipNotifier/**'
      - 'base44/functions/partyLifecycle/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tests/security-base44-access.test.mjs'
      - '.github/workflows/base44-security-check.yml'
  pull_request:
    paths:
      - 'base44/entities/**'
      - 'base44/functions/clanMembershipNotifier/**'
      - 'base44/functions/partyLifecycle/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tests/security-base44-access.test.mjs'
      - '.github/workflows/base44-security-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify entity RLS and forged event safeguards
        run: node --test tests/security-base44-access.test.mjs
      - name: Fail if production dependencies have known high or critical vulnerabilities
        run: npm audit --omit=dev --audit-level=high
