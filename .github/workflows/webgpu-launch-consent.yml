name: WebGPU launch consent
on:
  pull_request:
    paths:
      - 'src/components/games/hub/**'
      - 'src/lib/rendererBackendChoice.mjs'
      - 'tests/webgpuLaunchConsent.test.mjs'
      - '.github/workflows/webgpu-launch-consent.yml'
permissions:
  contents: read
jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test tests/webgpuLaunchConsent.test.mjs tests/rendererBackendChoice.test.mjs
      - run: npx eslint src/components/games/hub/GpuLaunchPrompt.jsx src/lib/rendererBackendChoice.mjs tests/webgpuLaunchConsent.test.mjs
      - run: npm run build
