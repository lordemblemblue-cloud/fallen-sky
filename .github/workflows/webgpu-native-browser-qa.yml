name: Native WebGPU browser QA helper tests

on:
  pull_request:
    paths:
      - 'scripts/webgpu-native-browser-qa.mjs'
      - 'tests/webgpuNativeBrowserQa.test.mjs'
      - '.github/workflows/webgpu-native-browser-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-qa-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # This helper and its tests use only Node built-ins. Run the focused
      # contract independently of any pre-existing full-suite/lint failures.
      - name: Verify native-backend and live-draw QA contract
        run: node --test tests/webgpuNativeBrowserQa.test.mjs
