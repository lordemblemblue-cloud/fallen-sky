name: Game 3D Clone Companion Imbuement UI

on:
  pull_request:
    paths:
      - 'src/components/game3d/axe/services/AXECompanionStylePane.jsx'
      - 'src/components/game3d/axe/services/AXECompanionStylePane.css'
      - 'src/components/game3d/axe/services/AXECompanionImbuementPane.jsx'
      - 'src/components/game3d/axe/services/AXECompanionImbuementPane.css'
      - 'src/components/game3d/axe/services/AXECompanionModelViewControl.jsx'
      - 'src/components/game3d/axe/services/AXECompanionModelViewControl.css'
      - 'src/components/game3d/axe/services/AXEImbuementPresentation.mjs'
      - 'tests/game3d-clone-companion-imbuement-unified.test.mjs'
      - 'tests/game3d-clone-companion-variety-five-slots.test.mjs'
      - 'tests/game3d-clone-companion-view-over-model.test.mjs'
      - '.github/workflows/game3d-clone-companion-imbuement.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  companion-imbuement:
    name: Variety / Imbuement UI and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check real Variety preview, body infusion, soul gates and wallet authority
        run: node --test tests/game3d-clone-companion-imbuement-unified.test.mjs tests/game3d-clone-companion-variety-five-slots.test.mjs tests/game3d-clone-companion-view-over-model.test.mjs
      - name: Build full Game 3D application
        run: npm run build
