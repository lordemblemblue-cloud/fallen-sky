name: Conduit combined integration
on:
  pull_request:
    paths:
      - 'src/components/duelist/client/maps/*onduit*'
      - 'src/components/duelist/sim/conduit*.mjs'
      - 'src/components/duelist/client/audio.mjs'
      - 'tests/duelist-conduit*.test.mjs'
      - 'scripts/export-duelist-conduit-manifest.mjs'
      - '.github/workflows/duelist-conduit-combined.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  combined:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --check src/components/duelist/sim/conduitMatchAdapter.mjs
      - run: node --test tests/duelist-conduit*.test.mjs
      - run: node scripts/export-duelist-conduit-manifest.mjs /tmp/conduit-layout.json
      - name: Verify trusted manifest checksum
        run: node --input-type=module -e "import {readFileSync} from 'node:fs'; import {createHash} from 'node:crypto'; const p='/tmp/conduit-layout.json'; if(createHash('sha256').update(readFileSync(p)).digest('hex')!==readFileSync(p+'.sha256','utf8').trim())process.exit(1);"
      - uses: actions/upload-artifact@v4
        with:
          name: conduit-trusted-layout
          path: /tmp/conduit-layout.json*
          retention-days: 7
      - run: npm run build
      - run: npm run lint
