name: Game 3D Escape Services Drawer

on:
  pull_request:
    paths:
      - 'src/pages/GameView.jsx'
      - 'src/components/game3d/PauseMenu.jsx'
      - 'src/components/game3d/PauseMenu.css'
      - 'src/components/game3d/game3dPauseMenuModel.mjs'
      - 'src/components/game3d/hud/JadeSoulHUD.jsx'
      - 'src/components/game3d/axe/services/game3dMenuHotkeys.mjs'
      - 'src/components/game3d/axe/services/AXECharacterShortcutRouting.mjs'
      - 'tests/game3d-clone-c-character-routing.test.mjs'
      - 'tests/game3d-escape-services-drawer-20261120.test.mjs'
      - '.github/workflows/game3d-escape-services-drawer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  escape-services:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate menu contracts and C/K toggle
        run: node --test tests/game3d-escape-services-drawer-20261120.test.mjs tests/game3d-skillbook-acquired-and-service-shortcuts-20261119.test.mjs tests/game3d-clone-c-character-routing.test.mjs
      - name: Compile app
        run: npm run build
