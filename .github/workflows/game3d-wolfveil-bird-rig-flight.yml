name: Game 3D Wolfveil Natural Bird Flight

on:
  pull_request:
    paths:
      - 'src/components/game3d/wolfveil/ambient/WolfveilAmbientBirds.mjs'
      - 'src/components/game3d/wolfveil/ambient/WolfveilBirdFlightPlan.mjs'
      - 'src/components/game3d/wolfveil/ambient/WolfveilBirdRigAnimation.mjs'
      - 'tests/game3d-clone-ambient-birds.test.mjs'
      - 'tests/game3d-wolfveil-natural-bird-rig-flight-20261117.test.mjs'
      - '.github/workflows/game3d-wolfveil-bird-rig-flight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bird-flight:
    name: Owner rig / keyframed flight / full game build
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test rig mapping, text animation and Wolfveil wildlife safety
        run: >
          node --test
          tests/game3d-clone-ambient-birds.test.mjs
          tests/game3d-wolfveil-natural-bird-rig-flight-20261117.test.mjs
      - name: Build Game 3D
        run: npm run build
