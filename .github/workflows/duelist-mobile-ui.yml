name: Duelist Landscape Mobile UI
on:
  pull_request:
    paths:
      - 'src/components/duelist/menu/duelistMobileUI.css'
      - 'src/components/duelist/menu/DuelistTemplateHub.jsx'
      - 'src/components/duelist/client/DuelistGame.jsx'
      - 'src/components/mobile/MobileTouchControls.jsx'
      - 'tests/duelist-mobile-ui.test.mjs'
      - '.github/workflows/duelist-mobile-ui.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Responsive layout and existing touch-input contracts
        run: node --test tests/duelist-mobile-ui.test.mjs tests/mobile-touch-controls-both-games.test.mjs tests/duelist-fullscreen-hud.test.mjs tests/duelist-class-picker-pose.test.mjs
      - name: Lint UI changes
        run: npx eslint src/components/duelist/menu/DuelistTemplateHub.jsx src/components/duelist/client/DuelistGame.jsx src/components/mobile/MobileTouchControls.jsx tests/duelist-mobile-ui.test.mjs
      - name: Full app build
        run: npm run build
