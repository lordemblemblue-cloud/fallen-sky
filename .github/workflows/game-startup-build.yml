name: Independent game startup build
on:
  pull_request:
    paths:
      - 'src/**'
      - 'package*.json'
      - 'vite.config.js'
      - '.github/workflows/game-startup-build.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'package*.json'
      - 'vite.config.js'
      - '.github/workflows/game-startup-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/verify-duelist-ui.mjs
