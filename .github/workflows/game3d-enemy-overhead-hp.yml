name: Game 3D Enemy Overhead HP Readability

on:
  pull_request:
    paths:
      - 'src/components/game3d/EnemyHealthBar.jsx'
      - 'src/components/game3d/enemyHpPresentation.mjs'
      - 'tests/game3d-enemy-overhead-hp.test.mjs'
      - '.github/workflows/game3d-enemy-overhead-hp.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  enemy-overhead-hp:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify health math and readable overhead layout
        run: node --test tests/game3d-enemy-overhead-hp.test.mjs
      - name: Lint modified health presentation
        run: npx eslint src/components/game3d/EnemyHealthBar.jsx src/components/game3d/enemyHpPresentation.mjs
      - name: Build application
        run: npm run build
