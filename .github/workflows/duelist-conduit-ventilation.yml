name: Conduit ventilation prototype
on:
  pull_request:
    paths:
      - 'src/components/duelist/client/maps/conduitVentilation.mjs'
      - 'tests/duelist-conduit-ventilation.test.mjs'
      - '.github/workflows/duelist-conduit-ventilation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check src/components/duelist/client/maps/conduitVentilation.mjs
      - run: node --test tests/duelist-conduit-ventilation.test.mjs
