name: Conduit render optimization
on:
  pull_request:
    paths:
      - 'src/components/duelist/client/maps/conduitArena.mjs'
      - 'src/components/duelist/client/maps/conduitRenderOptimization.mjs'
      - 'tests/duelist-conduit-render-optimization.test.mjs'
      - '.github/workflows/duelist-conduit-render-optimization.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --check src/components/duelist/client/maps/conduitRenderOptimization.mjs
      - run: node --check src/components/duelist/client/maps/conduitArena.mjs
      - run: node --test tests/duelist-conduit-import.test.mjs tests/duelist-conduit-render-optimization.test.mjs
      - run: npm run build
      - run: npm run lint
