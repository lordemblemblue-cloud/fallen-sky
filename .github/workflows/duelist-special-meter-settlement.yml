name: Duelist Special Meter Settlement
on:
  pull_request:
    paths:
      - 'src/components/duelist/sim/specialMeterSettlement.mjs'
      - 'src/components/duelist/sim/match.mjs'
      - 'tests/duelist-special-meter-settlement.test.mjs'
      - '.github/workflows/duelist-special-meter-settlement.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  settlement:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Four-class meter settlement and match regressions
        run: node --test tests/duelist-special-meter-settlement.test.mjs tests/duelist-match-classes.test.mjs
      - name: Lint touched modules
        run: npx eslint src/components/duelist/sim/specialMeterSettlement.mjs src/components/duelist/sim/match.mjs tests/duelist-special-meter-settlement.test.mjs
      - name: Build app
        run: npm run build
