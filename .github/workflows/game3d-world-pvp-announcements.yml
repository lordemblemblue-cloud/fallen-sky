name: Game 3D World PvP and Announcements Validation

on:
  pull_request:
    paths:
      - 'src/components/game3d/pvp/**'
      - 'src/components/game3d/notifications/WorldAnnouncement*'
      - 'src/pages/GameView.jsx'
      - 'server/game3d/worldPvpAuthority.mjs'
      - 'tests/game3d-world-pvp-and-announcements.test.mjs'
      - '.github/workflows/game3d-world-pvp-announcements.yml'
  workflow_dispatch:

jobs:
  pvp-world-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Validate PvE zone protection, PvP flags and trusted PK announcements
        run: node --test tests/game3d-world-pvp-and-announcements.test.mjs
      - name: Install dependencies
        run: npm ci
      - name: Lint app
        run: npm run lint
      - name: Verify build
        run: npm run build
