name: Game 3D Wolfveil Five-Area Loading and Platform Graphics

on:
  pull_request:
    paths:
      - 'src/components/game3d/wolfveil/streaming/**'
      - 'src/components/game3d/wolfveil/WolfveilAreaPortals.js'
      - 'src/components/game3d/wolfveil/WolfveilLayout.js'
      - 'src/components/game3d/wolfveil/WolfveilLandscapeDesign.mjs'
      - 'src/components/game3d/performance/Game3DPlatformGraphics.mjs'
      - 'src/components/game3d/performance/Game3DPlatformGraphicsPanel.jsx'
      - 'src/components/game3d/performance/Game3DAreaBudget.mjs'
      - 'src/components/game3d/performance/Game3DDisplaySettings.mjs'
      - 'src/components/game3d/performance/AdaptiveGraphics.mjs'
      - 'src/components/game3d/game3dPauseMenuModel.mjs'
      - 'tests/game3d-clone-wolfveil-five-area-loading.test.mjs'
      - 'tests/game3d-clone-platform-graphics.test.mjs'
      - '.github/workflows/game3d-clone-wolfveil-five-area-loading.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  five-area-loading:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Five areas, portals, area loader, platform profiles and budgets
        run: |
          node --test \
            tests/game3d-clone-wolfveil-five-area-loading.test.mjs \
            tests/game3d-clone-platform-graphics.test.mjs
