name: Game 3D Wolfveil Five-Area Loading and Platform Graphics

on:
  pull_request:
    paths:
      - 'src/components/game3d/wolfveil/**'
      - 'src/components/game3d/cave/**'
      - 'src/components/game3d/performance/**'
      - 'src/components/game3d/GameWorld3D.jsx'
      - 'src/components/game3d/PauseMenu.jsx'
      - 'src/components/game3d/Game3DAreaNotice.jsx'
      - 'src/components/game3d/debug/RenderStatsOverlay.jsx'
      - 'src/components/game3d/game3dPauseMenuModel.mjs'
      - 'src/pages/GameView.jsx'
      - 'scripts/report-wolfveil-area-loading.mjs'
      - 'tests/game3d-clone-wolfveil-five-area-loading.test.mjs'
      - 'tests/game3d-clone-wolfveil-area-loading-real-world.test.mjs'
      - 'tests/game3d-clone-platform-graphics.test.mjs'
      - 'tests/game3d-clone-wolfveil-cave-draw-budget.test.mjs'
      - 'tests/game3d-clone-far-proxy.test.mjs'
      - 'tests/game3d-clone-wolfveil-near-grass-detail.test.mjs'
      - '.github/workflows/game3d-clone-wolfveil-five-area-loading.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  five-area-loading:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Five areas, portals, area loader, platform profiles, budgets and cave draw budget
        run: |
          node --test \
            tests/game3d-clone-wolfveil-five-area-loading.test.mjs \
            tests/game3d-clone-platform-graphics.test.mjs \
            tests/game3d-clone-wolfveil-cave-draw-budget.test.mjs \
            tests/game3d-clone-far-proxy.test.mjs \
            tests/game3d-clone-wolfveil-near-grass-detail.test.mjs

  real-valley:
    name: Real valley under real Three.js, lint and production build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install lockfile dependencies
        run: npm ci
      - name: Area loader against the real Wolfveil valley (every area, every portal)
        run: |
          node --test --test-force-exit \
            tests/game3d-clone-wolfveil-area-loading-real-world.test.mjs
      - name: Report what one loaded area costs (with the artisan town)
        run: node scripts/report-wolfveil-area-loading.mjs --town
      - name: Lint the new files (must be clean)
        run: |
          npx eslint --quiet \
            src/components/game3d/wolfveil/streaming/WolfveilFiveAreaPlan.mjs \
            src/components/game3d/wolfveil/streaming/WolfveilAreaPortalPlan.mjs \
            src/components/game3d/wolfveil/streaming/WolfveilAreaLoader.mjs \
            src/components/game3d/wolfveil/WolfveilAreaPortals.js \
            src/components/game3d/Game3DAreaNotice.jsx \
            src/components/game3d/performance/Game3DPlatformGraphics.mjs \
            src/components/game3d/performance/Game3DPlatformGraphicsPanel.jsx \
            src/components/game3d/performance/Game3DAreaBudget.mjs \
            src/components/game3d/performance/Game3DStaticInstancing.mjs \
            src/components/game3d/performance/Game3DFarProxy.mjs \
            scripts/measure-wolfveil-terrain-detail.mjs \
            src/components/game3d/wolfveil/WolfveilFarOutline.js \
            src/components/game3d/wolfveil/WolfveilNearGrassDetail.mjs \
            src/components/game3d/wolfveil/WolfveilCaveDrawBudget.mjs \
            scripts/report-wolfveil-area-loading.mjs \
            tests/game3d-clone-wolfveil-five-area-loading.test.mjs \
            tests/game3d-clone-wolfveil-area-loading-real-world.test.mjs \
            tests/game3d-clone-platform-graphics.test.mjs \
            tests/game3d-clone-wolfveil-cave-draw-budget.test.mjs \
            tests/game3d-clone-far-proxy.test.mjs \
            tests/game3d-clone-wolfveil-near-grass-detail.test.mjs
      - name: Lint the edited files (no more errors than main)
        run: |
          count() { node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).reduce((n,r)=>n+r.errorCount,0))}catch{console.log(-1)}})'; }
          status=0
          for file in \
            src/components/game3d/GameWorld3D.jsx \
            src/components/game3d/wolfveil/WolfveilCaveSystem.js \
            src/components/game3d/wolfveil/WolfveilNearGrassStream.js \
            src/components/game3d/wolfveil/WolfveilIndividualGrassBlades.js \
            src/components/game3d/PauseMenu.jsx \
            src/components/game3d/debug/RenderStatsOverlay.jsx \
            src/pages/GameView.jsx; do
            head=$(npx eslint --quiet -f json "$file" | count || true)
            base=$(git show "origin/main:$file" | npx eslint --quiet -f json --stdin --stdin-filename "$file" | count || true)
            echo "$file: errors on this branch $head, on main $base"
            if [ "$head" -lt 0 ] || [ "$base" -lt 0 ] || [ "$head" -gt "$base" ]; then status=1; fi
          done
          exit $status
      - name: Compile the real Game 3D application
        run: npm run build
