name: Duelist class action costs
on:
  pull_request:
    paths:
      - 'src/components/duelist/core/**'
      - 'tests/duelist-class-action-costs.test.mjs'
      - '.github/workflows/duelist-class-action-costs.yml'
permissions:
  contents: read
jobs:
  class-actions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/duelist-class-action-costs.test.mjs
      - run: npm ci
      - run: npx eslint tests/duelist-class-action-costs.test.mjs
