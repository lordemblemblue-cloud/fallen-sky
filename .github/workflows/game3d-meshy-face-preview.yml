name: Game 3D Meshy Face Preview Safety

on:
  pull_request:
    paths:
      - 'server/game3d/meshyFaceDraftService.mjs'
      - 'src/routes/api/game3d-face.js'
      - 'src/components/onboarding/MeshyFaceDraft*.jsx'
      - 'src/components/onboarding/CharacterAppearanceEditor.jsx'
      - 'src/components/onboarding/genesis.css'
      - 'tests/game3d-meshy-face-draft.test.mjs'
      - '.github/workflows/game3d-meshy-face-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  meshy-preview:
    name: Privacy, signed-tasks and face-creator regression
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Meshy backend and creator protection tests (no paid requests)
        run: node --test tests/game3d-meshy-face-draft.test.mjs
      - name: Install dependencies
        run: npm ci
      - name: Lint new client and provider code
        run: npx eslint server/game3d/meshyFaceDraftService.mjs src/routes/api/game3d-face.js src/components/onboarding/MeshyFaceDraftCreator.jsx src/components/onboarding/MeshyFaceDraftPreview.jsx src/components/onboarding/CharacterAppearanceEditor.jsx --quiet
      - name: Build Game 3D app
        run: npm run build
