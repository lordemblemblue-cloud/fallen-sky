<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Game 3D animation preview</title>
<style>
  html, body { margin: 0; height: 100%; background: #202328; color: #e8edf2; font: 13px/1.45 system-ui, sans-serif; overflow: hidden; }
  #hud { position: fixed; left: 12px; top: 10px; max-width: 520px; background: rgba(8, 12, 18, .78); border: 1px solid rgba(255,255,255,.14); border-radius: 10px; padding: 10px 12px; white-space: pre-wrap; pointer-events: none; }
  #bar { position: fixed; left: 12px; bottom: 10px; display: flex; flex-wrap: wrap; gap: 6px; max-width: 900px; }
  #bar button, #bar a { font: inherit; color: #e8edf2; background: #2d3340; border: 1px solid #4a5468; border-radius: 7px; padding: 5px 9px; cursor: pointer; text-decoration: none; }
  #bar button:hover, #bar a:hover { background: #3b4457; }
  #log { position: fixed; right: 12px; top: 10px; width: 360px; max-height: 70vh; overflow: auto; background: rgba(8, 12, 18, .72); border: 1px solid rgba(255,255,255,.12); border-radius: 10px; padding: 8px 10px; font: 11px/1.4 ui-monospace, monospace; white-space: pre-wrap; }
  canvas { display: block; }
</style>
</head>
<body>
<div id="hud">loading…</div>
<div id="log"></div>
<div id="bar"></div>
<script type="module" src="./preview.js"></script>
</body>
</html>
