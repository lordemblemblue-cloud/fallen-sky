<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Enchantment Light Live Check</title>
  <style>
    html, body { margin: 0; background: #0d1117; color: #d8e2ee; font: 12px system-ui, sans-serif; }
    #root { display: grid; grid-template-columns: 380px minmax(0, 1fr); gap: 12px; padding: 10px; }
    .stage { position: relative; width: 380px; height: 600px; border: 1px solid #263040; border-radius: 8px; overflow: hidden; }
    .stage > * { width: 100%; height: 100%; }
    .rows { display: grid; gap: 8px; align-content: start; }
    .row { border: 1px solid #263040; border-radius: 8px; padding: 8px; }
    .row b { color: #f0f5fb; }
    button { margin: 2px; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./live.jsx"></script>
</body>
</html>
